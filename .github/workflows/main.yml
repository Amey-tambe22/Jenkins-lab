# ---
name: workflow-runs linux commands
on: workflow_dispatch
jobs:
  job1:
    runs-on: ubuntu-latest 
    steps:
      - name: Execute a linux command
        run: echo "Hello, World!"
  job2:
    needs: job1
    runs-on: ubuntu-24.04
    steps:
      - name: Execute set of linux commands
        run: |
          hostname -s
          echo "Thankyou all"
